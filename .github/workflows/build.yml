name: "Gradle build"
permissions:
  contents: write
on:
  - push
  - pull_request
  - workflow_dispatch

jobs:
  build:
    name: "Gradle build Debug"
    runs-on: ubuntu-latest
    env:
      GRADLE_MICROG_VERSION_WITHOUT_GIT: 1

    steps:
      - name: "Free disk space"
        run: |
          # Deleting unneeded software packages
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /opt/hostedtoolcache/go

          # Log available space
          df -h
      - name: "Checkout sources"
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: "Setup Java"
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"
      - name: "Setup Gradle"
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GradleEncryptionKey }}
          build-scan-publish: true
          build-scan-terms-of-use-url: "https://gradle.com/help/legal-terms-of-use"
          build-scan-terms-of-use-agree: "yes"
      - name: "Setup matchers"
        run: |
          # Setting up matchers...

          matchers_dir='${{ github.workspace }}/.github/matchers'
          matcher_list()
          {
            echo 'gradle-build-matcher.json'
            echo 'gradle-build-kotlin-error-matcher.json'
          }

          matcher_list | while IFS='' read -r NAME; do
            if test -f "${matchers_dir:?}/${NAME:?}"; then
              echo "::add-matcher::${matchers_dir:?}/${NAME:?}"
              echo "Matcher configured: ${NAME:?}"
            fi
          done
      - name: "Execute Gradle assemble"
        run: "./gradlew assembleDebug"
      - name: "Upload ReVanced GmsCore APK"
        uses: actions/upload-artifact@v4
        with:
          name: "gmscore-pkg-rename-artifact"
          path: "play-services-core/build/outputs/apk/mapboxUser/debug/app.revanced.android.gms-*.apk"
          if-no-files-found: error
      - name: "Publish GitHub pre-release"
        if: github.event_name != 'pull_request' && github.ref_name == 'ci-artifact-helper'
        uses: ncipollo/release-action@v1
        with:
          artifacts: "play-services-core/build/outputs/apk/mapboxUser/debug/app.revanced.android.gms-*.apk"
          artifactErrorsFailBuild: true
          prerelease: true
          tag: "gmscore-pkg-rename-test-${{ github.run_number }}-${{ github.run_attempt }}"
          name: "gmscore-pkg-rename test build #${{ github.run_number }}.${{ github.run_attempt }}"
          body: |
            Test build for the `gmscore-pkg-rename` branch.

            Changes in this build:
            - Fixes Android Auto integration.
            - Fixes ReVanced YT Music connecting to Android Auto.
            - Push notifications for both ReVanced YouTube and ReVanced YT Music should now work.
            - Updates package-sensitive resolution paths and call sites to correctly target the renamed ReVanced CoreGms package in side-by-side install scenarios.

            Install notes:
            - If you already have ReVanced CoreGms (`app.revanced.android.gms`) installed, uninstall it first before installing this build.
            - This build is debug-signed and cannot upgrade an existing release-signed installation.
